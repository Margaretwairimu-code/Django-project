{% extends 'master.html' %}
{% load static %}

{% block title %} products {% endblock %}

{% block content %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-8">
                <table class="table">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Ages</th>
                        <th>Scores</th>
                    </tr>
                    {% for student in students %}
                        <tr>
                            <td>{{ student.name }}</td>
                            <td>{{ student.email }}</td>
                            <td>{{ student.age }}</td>
                            <td>{{ student.score }}</td>
                        </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>

{% endblock %}
